name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            make
            autoconf
            automake
            libtool
            pkg-config
            mingw-w64-ucrt-x86_64-libusb

      - name: Build OpenOCD
        shell: msys2 {0}
        run: |
          ./bootstrap
          ./configure --enable-ch341a --enable-internal-jimtcl --disable-werror
          make

      - name: Gather Application and DLLs
        shell: msys2 {0}
        run: |
          mkdir dist
          cp src/openocd.exe dist/
          # Összegyűjtjük a létező DLL-eket, de nem omlunk össze, ha valamelyik hiányzik
          cp /ucrt64/bin/libusb-1.0.dll dist/ || true
          cp /ucrt64/bin/libwinpthread-1.0.dll dist/ || true
          cp /ucrt64/bin/libgcc_s_ucrt64-1.dll dist/ || cp /ucrt64/bin/libgcc_s_seh-1.dll dist/ || true
          cp /ucrt64/bin/libstdc++-6.dll dist/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-ch341a-complete
          path: dist/
